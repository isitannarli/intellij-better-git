name: Build and verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_compatibility:
        description: Download and verify against IntelliJ IDEA, WebStorm, GoLand and Rider
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - name: Test core and IDE integration, then package plugin
        run: ./gradlew :core:test :test verifyPluginProjectConfiguration buildPlugin --stacktrace --no-daemon
      - name: Upload installable plugin
        uses: actions/upload-artifact@v7
        with:
          name: intellij-better-git
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/
            core/build/reports/tests/
            core/build/test-results/
          retention-days: 14

  compatibility:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_compatibility
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: true
      - name: Verify all configured IDEs
        run: ./gradlew verifyPlugin --stacktrace --no-daemon
      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          retention-days: 14

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read plugin version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.version }} already exists; bump the version to publish a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up JDK 25
        if: steps.existing.outputs.exists == 'false'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle and validate wrapper
        if: steps.existing.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: true
      - name: Package plugin
        if: steps.existing.outputs.exists == 'false'
        run: ./gradlew buildPlugin --stacktrace --no-daemon
      - name: Publish GitHub release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Use this version's CHANGELOG section as the release notes.
          awk -v heading="## $VERSION " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md for details." > release-notes.md
          gh release create "v$VERSION" build/distributions/*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Better Git $VERSION" --notes-file release-notes.md
